# The morning robot: produces the day's edition, commits it into data/, and Vercel
# redeploys the site from that commit.
#
# Scheduling note — GitHub does NOT start scheduled workflows on time: it queues them
# and starts them when it has capacity, often hours late. So instead of asking
# "is it six o'clock?", every scheduled run asks "has today's edition been published
# yet?" and does the work if not. Several slots are registered so that the first one
# to actually start takes care of the day; the later ones find the edition and stop.

name: Morning edition

on:
  schedule:
    # Minutes in UTC. Paris is UTC+1 in winter, UTC+2 in summer.
    - cron: "30 3 * * *"   # 04:30 / 05:30 Paris
    - cron: "30 4 * * *"   # 05:30 / 06:30 Paris
    - cron: "15 5 * * *"   # 06:15 / 07:15 Paris
    - cron: "0 7 * * *"    # 08:00 / 09:00 Paris — safety net
  workflow_dispatch:
    inputs:
      category:
        description: "Only one section (id from config/sources.yaml), empty = all"
        required: false
        default: ""
      dry_run:
        description: "Dry run: only check that sources answer (no Claude, nothing committed)"
        type: boolean
        default: false
      force:
        description: "Run even if today's edition already exists (re-run the day)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: morning-edition
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Has today's edition been published yet?
        id: gate
        env:
          FORCE: ${{ github.event.inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          TODAY=$(TZ=Europe/Paris date +%Y-%m-%d)
          NOW=$(TZ=Europe/Paris date +%H:%M)
          echo "Paris time: $TODAY $NOW"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual run — going ahead."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ -f "data/days/$TODAY.json" ] && [ "$FORCE" != "true" ]; then
            echo "Edition of $TODAY already published — nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No edition for $TODAY yet — running the robot."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci --no-audit --no-fund

      - name: Run the robot
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TZ: Europe/Paris
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.category }}" ]; then ARGS="$ARGS --category=${{ github.event.inputs.category }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          npx tsx scripts/aggregate.ts $ARGS

      - name: Commit today's edition
        if: steps.gate.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          TODAY=$(TZ=Europe/Paris date +%Y-%m-%d)
          if [ ! -f "data/days/$TODAY.json" ]; then
            echo "::error::The robot finished but produced no edition for $TODAY."
            exit 1
          fi
          git config user.name "The Daily Yam robot"
          git config user.email "robot@thedailyyam.local"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Edition of $TODAY"
            # Another commit may have landed meanwhile (a code push): rebase, then push with a few retries.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "Push attempt $attempt failed, retrying…"
              sleep 10
            done
          fi
