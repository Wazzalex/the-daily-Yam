# Words, on demand. The Saturday robot (morning-edition.yml) builds the Words session with the
# Weekly; this one rebuilds it any day — when the notebook snapshot or its parser change in the
# repository, or by hand (Actions → Words → Run workflow).
#
# The robot reads Yamuna's notebook live when the Google Doc is shared "anyone with the link can
# view"; otherwise it uses the snapshot committed in data/words/source.json.

name: Words

on:
  push:
    branches: [main]
    paths:
      - "data/words/source.json"
      - "scripts/lib/words-doc.ts"
  workflow_dispatch:
    inputs:
      force:
        description: "Redo this week's session even if one exists"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: morning-edition
  cancel-in-progress: false

jobs:
  words:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the Words session from the notebook
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TZ: Europe/Paris
        run: |
          ARGS="--words"
          # A push rebuilds the week's session; a manual run follows its "force" box.
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          npx tsx scripts/aggregate.ts $ARGS

      - name: Commit the session
        run: |
          TODAY=$(TZ=Europe/Paris date +%Y-%m-%d)
          git config user.name "The Daily Yam robot"
          git config user.email "robot@thedailyyam.local"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Words of $TODAY"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "Push attempt $attempt failed, retrying…"
              sleep 10
            done
          fi

      - name: Warm the drill audio on the live site
        continue-on-error: true
        run: |
          SITE="https://www.the-daily-yam.com"
          TODAY=$(TZ=Europe/Paris date +%Y-%m-%d)
          [ -f "data/words/$TODAY.json" ] || { echo "No session for $TODAY."; exit 0; }
          for i in $(seq 1 30); do
            LIVE=$(curl -s -m 20 "$SITE/api/health" | sed -n 's/.*"words":"\([0-9-]*\)".*/\1/p')
            if [ "$LIVE" = "$TODAY" ]; then echo "Site serves the session of $TODAY after ~$((i*20))s"; break; fi
            sleep 20
          done
          if [ "$LIVE" != "$TODAY" ]; then echo "Site not updated yet; the audio will be made on first play."; exit 0; fi
          curl -s -m 280 -o /dev/null -w "words drill: HTTP %{http_code}\n" "$SITE/api/audio?kind=drill&date=$TODAY&json=1"
