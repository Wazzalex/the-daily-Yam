  - id: bfi
    name: BFI corner
    tagline: "Everything around this year's BFI programme, its works and its people."
    color:
      ink: "#3A5E95"
      tint: "#E5ECF7"
    brief: >
      The Baccalauréat Français International, British section: official texts
      and reforms, the ACL programme and its works (adaptations, new editions,
      stage productions, anniversaries, interviews with authors), teaching ideas,
      talks and videos usable in class, and news about international sections.
      Favour what helps a teacher of seconde, première and terminale.
    # Œuvres au programme → le robot crée automatiquement une recherche d'actualité par œuvre.
    # Source : BO n° 17 du 24 avril 2025 (ACL anglais britannique) et annexe session 2028.
    works:
      session_2027:            # première en 2025-26, terminale en 2026-27
        - Twelfth Night (Shakespeare)
        - Hamlet (Shakespeare)
        - Great Expectations (Dickens)
        - The Secret Agent (Conrad)
        - Brick Lane (Monica Ali)
        - The Rivals (Sheridan)
        - Dancing at Lughnasa (Brian Friel)
        - Under Milk Wood (Dylan Thomas)
        - Songs of Innocence and of Experience (Blake)
        - Gillian Clarke poet
        - Birthday Letters (Ted Hughes)
      session_2028:            # seconde en 2025-26, première en 2026-27
        - Tess of the d'Urbervilles (Hardy)
        - The Return of the Soldier (Rebecca West)
        - A Raisin in the Sun (Hansberry)
        - Robert Browning dramatic monologues
        - Sujata Bhatt poet
      oral_themes:             # thèmes d'oral communs aux deux sessions
        - The Handmaid's Tale (Atwood)
        - 1984 (Orwell)
        - Never Let Me Go (Ishiguro)
        - Prophet Song (Paul Lynch)
        - Parable of the Sower (Octavia Butler)
        - The Road (Cormac McCarthy)
        - Atonement (McEwan)
        - Emma (Jane Austen)
        - The Go-Between (Hartley)
        - I Know Why the Caged Bird Sings (Maya Angelou)
        - Anita and Me (Meera Syal)
        - Sweet Sorrow (David Nicholls)
    sources:
      - name: Baccalauréat français international (actualité)
