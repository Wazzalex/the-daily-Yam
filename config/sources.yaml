# =====================================================================
#  THE DAILY YAM — Base de sources
#  ---------------------------------------------------------------------
#  Ce fichier pilote tout le site : les rubriques du menu, leurs couleurs,
#  ce que le robot du matin va lire à 6h, et comment Claude choisit,
#  résume et classe les contenus pour Yamuna.
#
#  AJOUTER UNE SOURCE : copie un bloc "- name:" sous la rubrique voulue.
#    type: rss      → un flux RSS/Atom                       (url)
#    type: youtube  → une chaîne YouTube                      (handle ou channel_id)
#    type: podcast  → un podcast                              (feed_url, apple_id ou search)
#    type: page     → une page web que Claude lit et dont il  (url)
#                     extrait les contenus datés (agendas, expositions…)
#    type: news     → une recherche d'actualité Google News   (query, lang)
#    weight         → 0.5 = secondaire · 1 = normal · 1.5–2 = favori
#
#  AJOUTER UNE RUBRIQUE : copie un bloc complet sous "categories:" avec un
#  id unique (lettres minuscules), un nom, deux couleurs, une description
#  "brief" et ses sources. L'onglet, la page, le mix de la home et le
#  récap audio se créent tout seuls.
#
#  Le robot vérifie chaque source tous les matins : une source qui ne
#  répond plus est signalée dans le rapport du jour, jamais inventée.
#  Les lignes "# à confirmer" sont des adresses plausibles que le robot
#  validera au premier passage.
# =====================================================================

site:
  name: The Daily Yam
  tagline: "Everything I love, every morning."
  motto: "All the news that's fit for Yamuna"
  timezone: Europe/Paris
  refresh_hour: 6              # heure locale de la mise à jour quotidienne
  language: en                 # langue de l'interface et des résumés

reader:
  name: Yamuna
  # Profil utilisé par Claude pour choisir "les plus pertinents" et pour le ton du bot.
  profile: >
    Yamuna is an English literature teacher at an international lycée in Grenoble
    (British section, seconde and première, soon the BFI in terminale). She loves
    culture and fiction above all: strong characters, memorable narrators, stories
    one can step into without needing to know the culture first, and novels that
    teach history better than history essays do. She is drawn to the links between
    paintings and written works, and to passages that are beautiful as language —
    poetic, musical prose. She enjoys thrillers, documentaries about dance and
    classical music, and good news from anywhere. She lives in Les Adrets
    (Belledonne, above the Grésivaudan valley) and likes local exhibitions,
    producers' markets, flea markets and concerts.
  loves:
    - fiction with strong characters and narrators
    - poetic, beautifully written passages
    - history learned through novels
    - connections between paintings and literature
    - thrillers, dance and classical-music documentaries
    - good news, local life around Les Adrets and Grenoble
  avoids:
    - party politics, economics, polemics
    - celebrity gossip
    - cinema box-office and film-industry news (low priority)

rules:
  window_hours: 48             # un contenu est "nouveau" pendant 48 h
  window_hours_media: 168      # podcasts et vidéos : 7 jours (ils sortent chaque semaine)
  keep_days: 14                # jours consultables sur le site (le reste est archivé dans le repo)
  max_per_category_per_day: 10
  home_mix_size: 12            # nombre de contenus sur la page d'accueil
  summary_language: en         # résumés toujours en anglais, titre d'origine conservé
  prefer_english_sources: true # à pertinence égale, la source anglaise gagne
  audio_recap_minutes: 6       # récap audio par rubrique (bouton "long version" = 12)
  audio_recap_long_minutes: 12
  # Sources interdites : rien n'est repris de ces domaines, même via Google News.
  blocked_domains:
    - cnews.fr
    - bfmtv.com
    - europe1.fr
    - lejdd.fr
    - valeursactuelles.com
    - causeur.fr
    - bvoltaire.fr
    - frontieresmedia.fr
    - livrenoir.fr
    - sudradio.fr
    # À trancher par toi (décommente pour bloquer) :
    # - lefigaro.fr
    # - lepoint.fr

