# =====================================================================
#  THE DAILY YAM — Configuration (v2, novembre 2026)
#  ---------------------------------------------------------------------
#  Deux rendez-vous :
#    • The Daily Yam  — chaque matin, un audio de 3–4 minutes sur la
#      littérature et la culture, rien d'autre à lire.
#    • The Weekly Yam — le samedi, par rubrique, 2 choses à écouter et
#      2 à lire au maximum, choisies dans la réserve de la semaine.
#  Plus deux onglets personnels : Words (vocabulaire) et Bookshelf (livres).
#
#  AJOUTER UNE SOURCE : copie un bloc "- name:" sous la rubrique voulue.
#    type: rss      → un flux RSS/Atom                       (url)
#    type: youtube  → une chaîne YouTube                      (handle ou channel_id)
#    type: podcast  → un podcast                              (feed_url, apple_id ou search)
#    type: page     → une page web que Claude lit et dont il  (url)
#                     extrait les contenus datés
#    type: news     → une recherche d'actualité Google News   (query, lang)
#    weight         → 0.5 = secondaire · 1 = normal · 1.5–2 = favori
#
#  AJOUTER UNE RUBRIQUE : copie un bloc complet sous "categories:" avec un
#  id unique, un nom, deux couleurs, un "brief" et ses sources. L'onglet,
#  la page et la sélection du samedi se créent tout seuls. "show: false"
#  garde une rubrique en coulisses (ses contenus nourrissent le Daily
#  sans avoir d'onglet).
# =====================================================================

site:
  name: The Daily Yam
  tagline: "Everything I love, every morning."
  motto: "All the news that's fit for Yamuna"
  timezone: Europe/Paris
  refresh_hour: 6
  language: en

reader:
  name: Yamuna
  profile: >
    Yamuna is an English literature teacher at an international lycée in Grenoble.
    She loves culture and fiction above all: strong characters, memorable narrators,
    stories one can step into without needing to know the culture first, and novels
    that teach history better than history essays do. She is drawn to the links
    between paintings and written works, and to passages that are beautiful as
    language — poetic, musical prose. She enjoys thrillers, documentaries about
    dance and classical music, and good news from anywhere. She listens to the BBC
    every day, so she does not need the headlines repeated: she wants what sits
    beside the news — ideas, culture, society, a well-told story. She would rather
    listen than read, and has little time: a few well-chosen things a week beat a
    long list.
  loves:
    - fiction with strong characters and narrators
    - poetic, beautifully written passages
    - history learned through novels
    - connections between paintings and literature
    - thrillers, dance and classical-music documentaries
    - radio programmes and podcasts she can listen to while driving
  avoids:
    - party politics, economics, polemics, breaking news she already gets from the BBC
    - celebrity gossip
    - cinema box-office and film-industry news (low priority)
    - long reading lists

# Les deux rendez-vous.
editions:
  daily:
    minutes: 4                 # durée visée de l'audio du matin (≈ 600 mots)
    sections: [literature, art, watch, world]   # d'où viennent les sujets du Daily
    good_news_signoff: true    # finir par "and one good thing before you go"
    max_stories: 6             # sujets maximum dans le script (3–4 minutes, pas une liste)
  weekly:
    weekday: saturday          # jour de parution (heure : refresh_hour)
    per_section:
      listen: 2                # podcasts / vidéos
      read: 2                  # articles
    lookback_days: 8           # réserve considérée : la semaine écoulée
    book_of_the_week: true     # un livre de l'étagère par semaine (onglet Bookshelf)
    words_per_week: 20         # entrées de la session Words

rules:
  window_hours: 48             # un article est "nouveau" pendant 48 h
  window_hours_media: 168      # podcasts et vidéos : 7 jours (ils sortent chaque semaine)
  keep_days: 14                # réserve conservée (le reste est archivé dans le repo)
  keep_weeks: 8                # éditions hebdo consultables sur le site
  max_candidates_per_day: 25   # contenus jugés par rubrique et par jour (coût)
  summary_language: en
  prefer_english_sources: true
  blocked_domains:
    - cnews.fr
    - bfmtv.com
    - europe1.fr
    - lejdd.fr
    - valeursactuelles.com
    - causeur.fr
    - bvoltaire.fr
    - frontieresmedia.fr
    - livrenoir.fr
    - sudradio.fr
    # À trancher (décommente pour bloquer) :
    # - lefigaro.fr
    # - lepoint.fr

# Voix. "openai" = voix premium générée et mise en cache ; "browser" = la voix du téléphone.
audio:
  provider: openai
  model: gpt-4o-mini-tts
  voice: marin                   # Yamuna peut en choisir une autre sur /voices
  voices: [marin, cedar, fable, sage, nova, shimmer]
  instructions: >
    Warm, unhurried British English (Received Pronunciation), like a seasoned
    BBC Radio 4 presenter reading to a single listener. A measured, slightly
    slower pace than the news; clear diction, gentle warmth, natural pauses
    between items, never salesy.
  instructions_fr: >
    Clear, natural Parisian French, unhurried, as a thoughtful radio presenter
    on France Culture would read a single word and an example sentence.
  speed: 1.0

# Vocabulaire : le Google Doc que Yamuna remplit. Le robot le lit chaque samedi.
words:
  google_doc_id: 1r2SbwuwFgMnkuLr87QS5R1yjlbpZMc0ACj061qg8IlA
  marker: "Add your words below this line"   # tout ce qui précède est ignoré
  per_week: 20
  review_after_weeks: 3        # un mot revient en révision après 3 semaines sans passage

# Étagère : la liste des livres est dans config/books.yaml (titres + auteurs).

